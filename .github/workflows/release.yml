name: Release

# Publishes @straddlecom/wizard to npm with provenance when a GitHub release is published.
# Authenticates with npm trusted publishing (OIDC through id-token: write), configured on npmjs.com for this
# repository and workflow, so there is no token secret. Trusted publishing needs npm 11.5.1 or later, which the
# publish job installs rather than relying on the npm bundled with Node.
# npm provenance also needs this repository to be public.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Check the release tag matches package.json
        run: test "${GITHUB_REF_NAME#v}" = "$(node -p 'require("./package.json").version')"

      - run: npm ci
      - run: npm run build
      - run: npm install -g npm@^11.5.1
      - run: npm publish --provenance --access public

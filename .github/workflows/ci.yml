name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Test fixture only: the local --bundle most tests use, the content of the fixture plugin releases, and the
      # state-file templates tests/contract.test.ts checks. The Wizard itself runs the newest 0.1.x plugin release; move
      # this ref when the skills change the state-file contract (wizard-program.md).
      - uses: actions/checkout@v5
        with:
          repository: straddle-build/skills
          ref: 643632e78654a4fa929873d0e1ec0ba15525a9e8
          path: .straddle-skills

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@v24.2.0
        with:
          globs: "*.md"

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
        env:
          STRADDLE_SKILLS_SOURCE: ${{ github.workspace }}/.straddle-skills
      - run: npm run build
      - run: npm pack --dry-run
